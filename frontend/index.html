<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Musivault" />
  <meta name="theme-color" content="#1a1b26" />
  <meta name="description" content="Manage your vinyl and CD collection" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musivault</title>
  <!--
    Applied before the first paint. ThemeContext also sets data-theme, but only
    from an effect, so without this every user whose theme isn't the daisyUI
    default sees a flash of the light theme on each load. Kept dependency-free
    and inline on purpose: an external script would be another round trip.
    'dark' must match DEFAULT_THEME in src/constants/themes.ts.
  -->
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';
    } catch (e) { /* localStorage can throw when cookies are blocked */ }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
